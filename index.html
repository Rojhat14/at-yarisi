function drawParticles() {

    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.dust ? 1.4 - a * 0.5 : 1), 0, TAU); ctx.fill(); }

  ctx.globalAlpha = 1;
}

function render() {

/* =====================================================================
   Ana döngü
   ===================================================================== */
let lastTs = performance.now(), fps = 60, fpsN = 0, fpsAcc = 0;
let lastDraw = 0;
function frame(ts) {
  const minGap = 1000 / Math.max(10, CONFIG.render.maxFps) - 2;
  if (CONFIG.render.maxFps < 60 && ts - lastDraw < minGap) { requestAnimationFrame(frame); return; }
  lastDraw = ts;
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  fpsN++; fpsAcc += dt; if (fpsAcc >= 1) { fps = Math.round(fpsN / fpsAcc); fpsN = 0; fpsAcc = 0; }
  dt = clamp(dt, 0, 0.05);
  try { update(dt); render(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
newRace();
requestAnimationFrame(frame);

(function () {
  if (!CONFIG.websocket.enabled) return;
  function connect() {
    let ws;
    try { ws = new WebSocket(wsUrl()); } catch (e) { setTimeout(connect, CONFIG.websocket.reconnectMs); return; }
    wsSock = ws;
    ws.onopen = () => { wsStatus = 'bağlı'; wsSend(screenInfo()); };
    ws.onmessage = m => {
      try {
        const d = JSON.parse(m.data);
        for (const x of Array.isArray(d) ? d : [d]) { if (x && x.type === 'tts') SPEECH.onTTS(x); else window.handleEvent(x); }
      } catch (e) { /* bozuk mesaj */ }
    };
    ws.onerror = () => {};
    ws.onclose = () => { wsStatus = 'bağlı değil'; if (wsSock === ws) wsSock = null; setTimeout(connect, CONFIG.websocket.reconnectMs); };
  }
  connect();
})();
